[package]
edition = "2021"
name = "cognet_wasm"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
cognet = {path = "../"}
num_cpus = "1.16.0"
serde = {version = "1.0", features = ["derive"]}
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
wasm-bindgen-rayon = "1.3.0"
web-sys = {version = "0.3.77", features = ["console"]}
