[workspace]
members = [
  "crates/*",
]
resolver = "2"

[workspace.package]
authors = ["Altrix"]
description = "Node Graph Engine for Visual Programming and Data Flow Management"
documentation = "https://altrix.org/"
edition = "2021"
homepage = "https://altrix.org/"
keywords = ["node", "graph", "algorithm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AltrixHub/cognet"
version = "0.1.0"

[workspace.dependencies]
rayon = "1.10"

[package]
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "cognet_examples"
publish = false
repository.workspace = true
version.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = {version = "1.43.0", features = ["full"]}

[dependencies]
cognet = {path = "crates/core"}

[[example]]
name = "add"
