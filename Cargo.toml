[package]
description = "Node Graph Engine for Visual Programming and Data Flow Management"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "cognet"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1.86"
inventory = "0.3.19"
rayon = "1.10"
strum = "0.26.3"
thiserror = "2.0.11"
tokio = {version = "1.43.0", features = ["full"]}
tracing = "0.1.41"
ulid = "1.1.4"

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = {version = "0.2.100"}
wasm-bindgen-rayon = {version = "1.3.0"}
