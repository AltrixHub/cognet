
[tasks.example-wasm]
cwd = "examples/wasm/web"
dependencies = ["prepare-wasm"]
description = "Example for wasm"
script = [
  "npx vite",
]
workspace = false

[tasks.prepare-wasm]
args = ["build", "--target", "web", "--out-dir", "../web/pkg"]
command = "wasm-pack"
cwd = "examples/wasm/rust"
description = "Example for wasm"
toolchain = "nightly-2024-08-02"
workspace = false

[tasks.example-add]
description = "Example for add node"
script = [
  "cargo run --example add",
]
workspace = false
